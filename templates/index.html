<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Scraper - Extract Contact Info</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <i data-lucide="globe" width="28" height="28"></i>
                </div>
                <div class="logo-text">
                    <h2>Web Scraper</h2>
                    <p>v1.0</p>
                </div>
            </div>

            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                <i data-lucide="sun" class="theme-icon-light"></i>
                <i data-lucide="moon" class="theme-icon-dark"></i>
                <span class="theme-label">Theme</span>
            </button>

            <div class="sidebar-footer">
                <p>Extract contact information from any website</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Content Area -->
            <div class="content-area">
                <!-- Unified Scraping Interface -->
                <div id="scraper" class="tab-content active">
                    <div class="page-header">
                        <h1>Extract Contact Information</h1>
                        <p>Enter one or multiple website URLs to extract emails, phone numbers, and addresses</p>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group form-group-full">
                                    <label>
                                        <i data-lucide="link" width="16" height="16"></i>
                                        Website URLs
                                    </label>
                                    <textarea id="urlInput" placeholder="https://example.com&#10;https://example2.com&#10;https://example3.com" class="textarea" rows="6"></textarea>
                                    <small>Enter one URL per line for batch processing</small>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>
                                        <i data-lucide="filter" width="16" height="16"></i>
                                        Block Keywords <span class="optional">(optional)</span>
                                    </label>
                                    <input type="text" id="blockKeywords" placeholder="e.g., noreply, @outlook, team" class="input">
                                    <small>Comma-separated keywords to filter out</small>
                                </div>
                            </div>

                            <button class="btn btn-primary btn-lg" onclick="scrapeUrls()">
                                <span class="btn-text">
                                    <i data-lucide="play" width="18" height="18"></i>
                                    Start Scraping
                                </span>
                                <span class="btn-loader" style="display:none;"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Progress Indicator -->
                    <div id="progressContainer" class="card" style="display:none;">
                        <div class="progress-section">
                            <div class="progress-info">
                                <span id="progressText">Starting...</span>
                                <span id="progressPercent">0%</span>
                            </div>
                            <div class="progress-bar">
                                <div id="progressFill" class="progress-fill"></div>
                            </div>
                        </div>
                        
                        <!-- Live Logs -->
                        <div class="logs-section" style="margin-top: 20px;">
                            <div class="logs-header">
                                <h4>
                                    <i data-lucide="file-text" width="16" height="16"></i>
                                    Live Logs
                                </h4>
                            </div>
                            <div id="liveLogsList" class="logs-list"></div>
                        </div>
                    </div>

                    <!-- Results -->
                    <div id="results" class="card results-card" style="display:none;">
                        <div class="card-header">
                            <h3>Results</h3>
                            <button class="btn btn-secondary btn-sm" onclick="downloadResults()">
                                <i data-lucide="download" width="16" height="16"></i>
                                Download CSV
                            </button>
                        </div>
                        <div id="resultsContent" class="card-body"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Theme toggle function
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            lucide.createIcons(); // Refresh icons
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
